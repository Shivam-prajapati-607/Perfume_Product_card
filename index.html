<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Product preview card component</title>
    <meta name="description" content="A product preview card component challenge on Frontend Mentor.">
    <meta property="og:title" content="Frontend Mentor | Product preview card component">
    <meta property="og:description" content="A product preview card component challenge on Frontend Mentor.">
    <meta property="og:image" content="https://frontend-mentor-challenges.vercel.app/challenges/product-preview-card-component/design/desktop-preview.jpg">
    <meta property="og:type" content="website">

    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <article class="product-card">
            <div class="Image-product">
            </div>
            <div class="product-details">
                <span class="product-category">Perfume</span>
                <h1 class="product-title">Gabrielle Essence Eau De Parfum</h1>
                <p class="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
                <div class="product-pricing">
                    <span class="current-price">$149.99</span>
                    <span class="original-price">$169.99</span>
                </div>
                <button aria-label="Add to cart">
                    <img src="images/icon-cart.svg" alt="" aria-hidden="true">
                    Add to Cart
                </button>
             </div>
        </article>
    </main>
    <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io/profile/Shivam-prajapati-607">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/Shivam-prajapati-607">Shivam Prajapati</a>.
    </footer>
</body>
</html>
